[project]
name = "opendesign"
version = "0.1.0"
description = "Open-source Claude Design recreation as an Open WebUI extension"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]

[tool.pytest.ini_options]
testpaths = ["tests"]
