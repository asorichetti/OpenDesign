<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title | default: 'Contact Us' }}</title>
    <style>
        :root { --primary: #6366f1; --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0; --bg: #ffffff; --radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        .contact-hero { text-align: center; padding: 4rem 0; }
        .contact-hero h1 { font-size: 3rem; font-weight: 700; margin-bottom: 1rem; }
        .contact-hero p { color: var(--text-secondary); font-size: 1.125rem; max-width: 600px; margin: 0 auto; }
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; padding: 3rem 0; }
        .contact-info { padding: 2rem; background: var(--bg-secondary); border-radius: var(--radius); }
        .contact-info h2 { font-size: 1.5rem; margin-bottom: 1.5rem; }
        .info-item { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .info-icon { width: 40px; height: 40px; background: var(--primary); color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; flex-shrink: 0; }
        .info-content h3 { font-size: 1rem; margin-bottom: 0.25rem; }
        .info-content p { color: var(--text-secondary); }
        .contact-form { display: flex; flex-direction: column; gap: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group label { font-weight: 600; }
        .form-group input, .form-group textarea { padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; font-family: inherit; }
        .form-group textarea { min-height: 150px; resize: vertical; }
        .submit-btn { padding: 1rem; background: var(--primary); color: white; border: none; border-radius: var(--radius); font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .submit-btn:hover { background: #4f46e5; transform: translateY(-2px); }
        @media (max-width: 768px) { .contact-grid { grid-template-columns: 1fr; } .contact-hero h1 { font-size: 2rem; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="contact-hero">
            <h1>{{ page_title | default: 'Get in Touch' }}</h1>
            <p>{{ page_subtitle | default: "We'd love to hear from you. Send us a message and we'll respond as soon as possible." }}</p>
        </div>
        <div class="contact-grid">
            <div class="contact-info">
                <h2>Contact Information</h2>
                <div class="info-item">
                    <div class="info-icon">📧</div>
                    <div class="info-content">
                        <h3>Email</h3>
                        <p>hello@example.com</p>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon">📞</div>
                    <div class="info-content">
                        <h3>Phone</h3>
                        <p>+1 (555) 123-4567</p>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon">📍</div>
                    <div class="info-content">
                        <h3>Address</h3>
                        <p>123 Main St, San Francisco, CA 94105</p>
                    </div>
                </div>
            </div>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="What's this about?">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Tell us what you need..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message →</button>
            </form>
        </div>
    </div>
</body>
</html>
