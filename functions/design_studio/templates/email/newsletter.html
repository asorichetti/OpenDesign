<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <title>{{ title }}</title>
    <!--[if mso]>
    <style>
        * { font-family: sans-serif !important; }
    </style>
    <![endif]-->
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f4f4f5;">
        <tr>
            <td align="center" style="padding: 2rem 1rem;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden;">
                    <tr>
                        <td style="padding: 2rem; background-color: #1a1a2b; text-align: center;">
                            <h1 style="color: #ffffff; margin: 0; font-size: 1.5rem;">{{ header }}</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 2rem;">
                            <p style="color: #6b6b6b; font-size: 1rem; line-height: 1.6;">{{ body }}</p>
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 1.5rem auto;">
                                <tr>
                                    <td style="border-radius: 6px; background-color: #1a1a2b; text-align: center;">
                                        <a href="{{ cta_link }}" style="display: inline-block; padding: 0.75rem 2rem; color: #ffffff; text-decoration: none; font-weight: 500;">{{ cta_text }}</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 1.5rem 2rem; text-align: center; border-top: 1px solid #e0e0e0;">
                            <p style="color: #999999; font-size: 0.75rem;">{{ footer }}</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
