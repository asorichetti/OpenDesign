<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>{{ title }}</title>
    <style>
        @media only screen and (max-width: 600px) {
            .container { width: 100% !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr><td align="center" style="padding: 2rem 1rem;">
            <table role="presentation" width="600" class="container" cellpadding="0" cellspacing="0" border="0" style="background: #fff; border-radius: 8px; overflow: hidden;">
                <tr><td style="padding: 2rem; text-align: center;">
                    <h2 style="color: #1a1a1a; margin: 0 0 1rem;">{{ title }}</h2>
                    <p style="color: #6b6b6b; font-size: 1rem;">{{ body }}</p>
                </td></tr>
                <tr><td style="padding: 0 2rem 2rem; text-align: center;">
                    <a href="#" style="display: inline-block; padding: 0.75rem 2rem; background: #1a1a2b; color: #fff; text-decoration: none; border-radius: 6px;">{{ cta_text }}</a>
                </td></tr>
            </table>
        </td></tr>
    </table>
</body>
</html>
