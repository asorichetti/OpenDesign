<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title | default: 'Hero Landing Page' }}</title>
    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0; --bg: #ffffff; --radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        .hero { text-align: center; padding: 6rem 0; background: linear-gradient(135deg, #f8fafc, #e0e7ff); }
        .hero h1 { font-size: 4rem; font-weight: 700; margin-bottom: 1.5rem; line-height: 1.1; }
        .hero p { font-size: 1.5rem; color: var(--text-secondary); max-width: 700px; margin: 0 auto 2rem; }
        .hero-actions { display: flex; gap: 1rem; justify-content: center; margin-bottom: 3rem; }
        .btn { padding: 1rem 2rem; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 1.125rem; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 10px 20px rgb(99 102 241 / 0.3); }
        .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); }
        .btn-outline:hover { background: #f8fafc; }
        .hero-image { margin: 3rem 0; }
        .hero-image img { max-width: 100%; border-radius: var(--radius); box-shadow: 0 20px 40px rgb(0 0 0 / 0.1); }
        .logos { text-align: center; padding: 3rem 0; border-top: 1px solid var(--border); }
        .logos p { color: var(--text-secondary); margin-bottom: 2rem; }
        .logo-grid { display: flex; justify-content: center; gap: 3rem; flex-wrap: wrap; opacity: 0.5; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="hero">
        <div class="container">
            <h1>{{ hero_title | default: 'Build Something Amazing' }}</h1>
            <p>{{ hero_subtitle | default: 'The modern platform for creating beautiful, responsive designs in minutes. No coding required.' }}</p>
            <div class="hero-actions">
                <a href="#" class="btn btn-primary">Get Started Free</a>
                <a href="#" class="btn btn-outline">Watch Demo</a>
            </div>
            <div class="hero-image">
                <img src="https://via.placeholder.com/1200x600/f8fafc/6366f1?text=Product+Screenshot" alt="Product Preview">
            </div>
        </div>
    </div>

    <div class="logos">
        <div class="container">
            <p>Trusted by teams at</p>
            <div class="logo-grid">
                <div class="logo">Google</div>
                <div class="logo">Microsoft</div>
                <div class="logo">Amazon</div>
                <div class="logo">Meta</div>
                <div class="logo">Apple</div>
            </div>
        </div>
    </div>
</body>
</html>
