<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2b; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .asset { width: 1200px; height: 630px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 4rem; text-align: center; color: #ffffff; }
        .asset h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 1rem; line-height: 1.1; }
        .asset p { font-size: 1.5rem; opacity: 0.9; max-width: 600px; }
        .asset .brand { position: absolute; bottom: 2rem; left: 2rem; font-size: 1.25rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="asset">
        <h1>{{ headline }}</h1>
        <p>{{ subtitle }}</p>
        <div class="brand">{{ brand }}</div>
    </div>
</body>
</html>
