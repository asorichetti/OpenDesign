<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Charts</title>
    <style>
        :root { --primary: #6366f1; --success: #22c55e; --warning: #f59e0b; --danger: #ef4444; --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0; --bg: #ffffff; --radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); padding: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 2rem; }
        .chart-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
        .chart-card h3 { margin-bottom: 1rem; font-size: 1.125rem; }
        .bar-chart { display: flex; align-items: flex-end; gap: 1rem; height: 200px; padding: 1rem 0; }
        .bar { flex: 1; background: var(--primary); border-radius: 8px 8px 0 0; transition: all 0.3s; position: relative; }
        .bar:hover { background: #4f46e5; }
        .bar-label { text-align: center; font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.5rem; }
        .line-chart { position: relative; height: 200px; border-left: 2px solid var(--border); border-bottom: 2px solid var(--border); }
        .line-chart svg { width: 100%; height: 100%; }
        .pie-chart { display: flex; gap: 2rem; align-items: center; }
        .pie { width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(var(--primary) 0% 40%, var(--success) 40% 70%, var(--warning) 70% 100%); }
        .pie-legend { display: flex; flex-direction: column; gap: 0.5rem; }
        .legend-item { display: flex; align-items: center; gap: 0.5rem; }
        .legend-color { width: 12px; height: 12px; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="margin-bottom: 2rem;">Interactive Charts</h1>
        <div class="charts-grid">
            <div class="chart-card">
                <h3>📊 Bar Chart</h3>
                <div class="bar-chart">
                    <div style="text-align: center; flex: 1;">
                        <div class="bar" style="height: 60%;"></div>
                        <div class="bar-label">Jan</div>
                    </div>
                    <div style="text-align: center; flex: 1;">
                        <div class="bar" style="height: 80%;"></div>
                        <div class="bar-label">Feb</div>
                    </div>
                    <div style="text-align: center; flex: 1;">
                        <div class="bar" style="height: 50%;"></div>
                        <div class="bar-label">Mar</div>
                    </div>
                    <div style="text-align: center; flex: 1;">
                        <div class="bar" style="height: 90%;"></div>
                        <div class="bar-label">Apr</div>
                    </div>
                    <div style="text-align: center; flex: 1;">
                        <div class="bar" style="height: 70%;"></div>
                        <div class="bar-label">May</div>
                    </div>
                </div>
            </div>
            <div class="chart-card">
                <h3>📈 Line Chart</h3>
                <div class="line-chart">
                    <svg viewBox="0 0 400 200">
                        <polyline fill="none" stroke="#6366f1" stroke-width="3" points="0,150 80,120 160,100 240,80 320,50 400,30" />
                        <polyline fill="none" stroke="#22c55e" stroke-width="3" points="0,180 80,160 160,140 240,120 320,100 400,80" />
                    </svg>
                </div>
            </div>
            <div class="chart-card">
                <h3>🥧 Pie Chart</h3>
                <div class="pie-chart">
                    <div class="pie"></div>
                    <div class="pie-legend">
                        <div class="legend-item">
                            <div class="legend-color" style="background: #6366f1;"></div>
                            <span>Product A (40%)</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #22c55e;"></div>
                            <span>Product B (30%)</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #f59e0b;"></div>
                            <span>Product C (30%)</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
