<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default("Modal") }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f7f7f8;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .trigger-btn {
            padding: 0.75rem 1.5rem;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .trigger-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Modal */
        .modal {
            background: white;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid #e0e0e0;
        }

        .modal-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #1a1a1a;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: #f0f0f0;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: #6b6b6b;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: #e0e0e0;
            color: #1a1a1a;
        }

        .modal-body {
            padding: 1.5rem;
            color: #6b6b6b;
            line-height: 1.6;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid #e0e0e0;
            background: #fafafa;
            border-radius: 0 0 12px 12px;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #1a1a1a;
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #6b6b6b;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #e53e3e;
            color: white;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        /* Alert variant */
        .modal.alert .modal-body {
            text-align: center;
        }

        .modal.alert .modal-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .modal.alert .modal-title {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        /* Form variant */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 0.375rem;
        }

        .form-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.875rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 3px rgba(26,26,26,0.1);
        }

        @media (max-width: 768px) {
            .modal { max-width: 100%; margin: 0; border-radius: 0; max-height: 100vh; }
            .modal-overlay { padding: 0; align-items: flex-end; }
        }
    </style>
</head>
<body>
    <button class="trigger-btn" onclick="modal.open('{{ id | default("demo") }}')">Open Modal</button>

    <div class="modal-overlay" id="modal-overlay-{{ id | default("demo") }}" role="dialog" aria-modal="true" aria-labelledby="modal-title-{{ id | default("demo") }}">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title-{{ id | default("demo") }}">{{ title | default("Modal Title") }}</h3>
                <button class="modal-close" onclick="modal.close('{{ id | default("demo") }}')" aria-label="Close modal">×</button>
            </div>

            <div class="modal-body">
                <p>{{ content | default("This is a modal dialog. You can use it for alerts, forms, confirmations, or any interactive content.") }}</p>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="modal.close('{{ id | default("demo") }}')">Cancel</button>
                <button class="btn btn-primary" onclick="modal.close('{{ id | default("demo") }}')">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        const modal = (() => {
            const modals = {};

            function open(id) {
                const overlay = document.getElementById(`modal-overlay-${id}`);
                if (overlay) {
                    overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                    // Focus trap
                    const closeBtn = overlay.querySelector('.modal-close');
                    if (closeBtn) closeBtn.focus();
                }
            }

            function close(id) {
                const overlay = document.getElementById(`modal-overlay-${id}`);
                if (overlay) {
                    overlay.classList.remove('active');
                    document.body.style.overflow = '';
                    // Return focus to trigger button
                    const trigger = document.querySelector(`[onclick*="open('${id}')"]`);
                    if (trigger) trigger.focus();
                }
            }

            // Close on overlay click
            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        const id = overlay.id.replace('modal-overlay-', '');
                        close(id);
                    }
                });
            });

            // Close on Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal-overlay.active').forEach(overlay => {
                        const id = overlay.id.replace('modal-overlay-', '');
                        close(id);
                    });
                }
            });

            return { open, close };
        })();

        // Store for multi-modal support
        window.opendesignModals = modal;
    </script>
</body>
</html>
