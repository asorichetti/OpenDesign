<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        :root {
            --color-bg: #FFFFFF;
            --color-text: #1A1A1A;
            --color-accent: #737373;
            --color-border: #E0E0E0;
            --font-family: system-ui, -apple-system, sans-serif;
            --font-size-base: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-family);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <!-- Navigation goes here -->
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            <!-- Main content goes here -->
        </div>
    </main>
    <footer>
        <div class="container">
            <!-- Footer goes here -->
        </div>
    </footer>
</body>
</html>
