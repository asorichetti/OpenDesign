<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="secondary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#primary-grad)" filter="url(#shadow)"/>

  <!-- Geometric design: Abstract design surface with creative tools -->
  <!-- Outer frame (design canvas) -->
  <rect x="126" y="126" width="260" height="260" rx="48" fill="none" stroke="white" stroke-width="12" opacity="0.9"/>

  <!-- Inner creative elements -->
  <!-- Pen tool cursor -->
  <path d="M 210 170 L 302 170 L 302 262 L 256 226 L 210 262 Z"
        fill="white" opacity="0.95"/>

  <!-- Brush stroke accent -->
  <path d="M 160 220 Q 256 180 352 220 Q 400 300 352 380 Q 256 420 160 380 Q 112 300 160 220Z"
        fill="url(#secondary-grad)" opacity="0.85"/>

  <!-- Decorative corner marks -->
  <path d="M 140 160 L 140 140 L 160 140" fill="none" stroke="white" stroke-width="4" opacity="0.5"/>
  <path d="M 372 140 L 392 140 L 392 160" fill="none" stroke="white" stroke-width="4" opacity="0.5"/>
  <path d="M 140 372 L 140 392 L 160 392" fill="none" stroke="white" stroke-width="4" opacity="0.5"/>
  <path d="M 372 392 L 392 392 L 392 372" fill="none" stroke="white" stroke-width="4" opacity="0.5"/>

  <!-- Accent dots -->
  <circle cx="130" cy="130" r="14" fill="white" opacity="0.7"/>
  <circle cx="382" cy="130" r="10" fill="white" opacity="0.5"/>
  <circle cx="130" cy="382" r="10" fill="white" opacity="0.5"/>
  <circle cx="382" cy="382" r="14" fill="white" opacity="0.7"/>
</svg>
