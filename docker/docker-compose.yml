# OpenDesigner — Docker Compose Configuration
#
# Usage:
#   Production: docker compose up -d
#   Development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# The production build pre-installs OpenDesigner.
# The development mode mounts local files for hot reloading.

services:
  openwebui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: openwebui
    ports:
      - "3000:8080"
    environment:
      - WEBUI_SECRET_KEY=change-me-in-production
      # Optional: configure Ollama
      # - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Optional: configure OpenAI
      # - OPENAI_API_KEY=sk-your-key-here
    volumes:
      # Persistent data for Open WebUI (including OpenDesigner functions)
      - openwebui_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  openwebui_data:
    driver: local
