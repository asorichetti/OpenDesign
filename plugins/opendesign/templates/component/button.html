<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f7f7f8; padding: 2rem; display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.625rem 1.25rem; border: none; border-radius: 6px; font-size: 0.875rem; font-weight: 500; cursor: pointer; text-decoration: none; line-height: 1.5; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: #1a1a2b; color: #ffffff; }
        .btn-secondary { background: #ffffff; color: #1a1a2b; border: 1px solid #e0e0e0; }
        .btn-ghost { background: transparent; color: #737373; }
        .btn-lg { padding: 0.75rem 1.5rem; font-size: 1rem; }
        .btn-sm { padding: 0.375rem 0.75rem; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div>
        <h3 style="text-align: center; margin-bottom: 0.5rem; color: #1a1a1a;">Primary</h3>
        <button class="btn btn-primary btn-lg">Large</button>
        <button class="btn btn-primary">Default</button>
        <button class="btn btn-primary btn-sm">Small</button>
    </div>
    <div>
        <h3 style="text-align: center; margin-bottom: 0.5rem; color: #1a1a1a;">Secondary</h3>
        <button class="btn btn-secondary btn-lg">Large</button>
        <button class="btn btn-secondary">Default</button>
        <button class="btn btn-secondary btn-sm">Small</button>
    </div>
    <div>
        <h3 style="text-align: center; margin-bottom: 0.5rem; color: #1a1a1a;">Ghost</h3>
        <button class="btn btn-ghost btn-lg">Large</button>
        <button class="btn btn-ghost">Default</button>
        <button class="btn btn-ghost btn-sm">Small</button>
    </div>
</body>
</html>
