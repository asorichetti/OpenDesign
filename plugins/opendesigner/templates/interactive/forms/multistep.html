<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Form</title>
    <style>
        :root { --primary: #6366f1; --primary-hover: #4f46e5; --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0; --bg: #ffffff; --radius: 12px; --success: #22c55e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); line-height: 1.6; }
        .container { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .form-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; }
        .step-indicators { display: flex; justify-content: space-between; margin-bottom: 2rem; position: relative; }
        .step-indicators::before { content: ''; position: absolute; top: 20px; left: 0; right: 0; height: 2px; background: var(--border); }
        .step { position: relative; z-index: 1; text-align: center; flex: 1; }
        .step-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--border); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; margin: 0 auto 0.5rem; font-weight: 600; transition: all 0.3s; }
        .step.active .step-circle { background: var(--primary); color: white; }
        .step.completed .step-circle { background: var(--success); color: white; }
        .step-label { font-size: 0.75rem; color: var(--text-secondary); }
        .form-step { display: none; }
        .form-step.active { display: block; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; font-family: inherit; }
        .form-actions { display: flex; justify-content: space-between; margin-top: 2rem; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { background: white; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: #f8fafc; }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="step-indicators">
                <div class="step active">
                    <div class="step-circle">1</div>
                    <div class="step-label">Personal</div>
                </div>
                <div class="step">
                    <div class="step-circle">2</div>
                    <div class="step-label">Professional</div>
                </div>
                <div class="step">
                    <div class="step-circle">3</div>
                    <div class="step-label">Review</div>
                </div>
            </div>

            <form>
                <div class="form-step active">
                    <h3 style="margin-bottom: 1.5rem;">Personal Information</h3>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" placeholder="+1 (555) 123-4567">
                    </div>
                </div>

                <div class="form-step">
                    <h3 style="margin-bottom: 1.5rem;">Professional Information</h3>
                    <div class="form-group">
                        <label>Company</label>
                        <input type="text" placeholder="Acme Inc.">
                    </div>
                    <div class="form-group">
                        <label>Job Title</label>
                        <input type="text" placeholder="Software Engineer">
                    </div>
                    <div class="form-group">
                        <label>Experience</label>
                        <select>
                            <option>Less than 1 year</option>
                            <option>1-3 years</option>
                            <option selected>3-5 years</option>
                            <option>5+ years</option>
                        </select>
                    </div>
                </div>

                <div class="form-step">
                    <h3 style="margin-bottom: 1.5rem;">Review & Submit</h3>
                    <div style="background: #f8fafc; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem;">
                        <p style="font-weight: 600; margin-bottom: 0.5rem;">Please verify your information:</p>
                        <p style="color: var(--text-secondary);">John Doe - john@example.com</p>
                        <p style="color: var(--text-secondary);">Acme Inc. - Software Engineer</p>
                    </div>
                </div>
            </form>

            <div class="form-actions">
                <button class="btn btn-outline">← Previous</button>
                <button class="btn btn-primary">Next →</button>
            </div>
        </div>
    </div>
</body>
</html>
