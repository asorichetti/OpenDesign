<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .modal { background: #fff; border-radius: 12px; max-width: 480px; width: 90%; overflow: hidden; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem; border-bottom: 1px solid #e0e0e0; }
        .modal-title { font-size: 1.125rem; font-weight: 600; color: #1a1a1a; }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: #999; cursor: pointer; line-height: 1; }
        .modal-body { padding: 1.5rem; color: #6b6b6b; font-size: 0.875rem; line-height: 1.6; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 0.75rem; padding: 1rem 1.5rem; border-top: 1px solid #e0e0e0; }
        .btn { padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500; cursor: pointer; border: none; }
        .btn-primary { background: #1a1a2b; color: #fff; }
        .btn-ghost { background: transparent; color: #737373; }
    </style>
</head>
<body>
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">{{ title }}</h3>
            <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
            {{ body }}
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost">Cancel</button>
            <button class="btn btn-primary">Confirm</button>
        </div>
    </div>
</body>
</html>
